# Este blueprint cobre só o frontend. Backend e banco NÃO estão aqui porque
# o Render não oferece nenhum dos dois de graça de forma permanente:
#   - Backend Java exige runtime: docker, e serviços Docker nunca entram no
#     plano free do Render (só runtimes nativos: node/python/ruby/go/...).
#   - O Postgres free do Render expira 30 dias após a criação e é deletado
#     (com os dados) após 14 dias de carência sem upgrade pago.
# Por isso o backend está hospedado no Koyeb (free, permanente, suporta
# Docker) e o banco no Neon (Postgres free, permanente, sem expiração).
# Veja as instruções de deploy desses dois na documentação do projeto.

services:
  - type: web
    name: configapp-mn-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
