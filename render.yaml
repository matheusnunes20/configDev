databases:
  - name: configapp-mn-db
    plan: free
    databaseName: configapp
    user: configapp

# O backend (Java/Spring Boot) NÃO está neste blueprint: o Render exige
# runtime: docker para apps Java, e serviços Docker não são elegíveis para o
# plano gratuito. Para a demonstração, o backend roda localmente e é exposto
# publicamente via um túnel (ngrok), conectado a este mesmo banco Postgres.

services:
  - type: web
    name: configapp-mn-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
