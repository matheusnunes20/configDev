# Backend (Docker) e frontend (static site) hospedados no Render.
# O PostgreSQL fica no Neon (não é um banco gerenciado pelo Render), por
# isso não existe bloco "databases" aqui — as credenciais de conexão são
# inseridas manualmente no dashboard do Render (campos "sync: false" abaixo).

services:
  - type: web
    name: configapp-mn-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_MODE
        value: require
      - key: API_KEY
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        value: https://configapp-mn-app.onrender.com

  - type: web
    name: configapp-mn-app
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://configapp-mn-api.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
